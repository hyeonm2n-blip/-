<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습지 제출 결과 다운로드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-xl w-full bg-white p-8 md:p-10 rounded-2xl shadow-xl text-center">
        
        <div class="mb-8">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 mb-4">
                <svg class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900 mb-2">관리자용 다운로드</h1>
            <p class="text-gray-600">학생들이 제출한 쾨펜 기후 학습지<br>결과 데이터를 CSV 파일로 다운로드합니다.</p>
        </div>

        <div class="p-6 bg-gray-50 border border-gray-200 rounded-lg mb-8 text-left">
            <h2 class="font-bold text-gray-800 mb-2">포함되는 데이터 항목:</h2>
            <ul class="list-disc list-inside text-gray-600 text-sm space-y-1">
                <li>제출 일시</li>
                <li>학생 정보 (학년, 반, 번호, 이름)</li>
                <li>객관식 3문항 응답</li>
                <li>주관식 2문항 응답</li>
            </ul>
        </div>

        <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl text-lg shadow-lg transform transition hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 flex items-center justify-center">
            <span id="btnText">CSV 데이터 다운로드</span>
            <svg id="loadingSpinner" class="hidden animate-spin ml-3 h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>

        <p id="statusMsg" class="mt-4 text-sm font-medium h-5 text-gray-600"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 제공해주신 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDpM0di7-ML4lSI7f9dfMaqF3oCtjgcdF8",
            authDomain: "hyeonm2n-7a7e9.firebaseapp.com",
            projectId: "hyeonm2n-7a7e9",
            storageBucket: "hyeonm2n-7a7e9.firebasestorage.app",
            messagingSenderId: "777173985817",
            appId: "1:777173985817:web:c59484708eb4a47a2d5888"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const downloadBtn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusMsg = document.getElementById('statusMsg');

        // CSV 셀에 들어갈 텍스트를 안전하게 이스케이프 처리하는 함수 (쉼표 포함 방지)
        function escapeCsv(text) {
            if (text === null || text === undefined) return '""';
            return '"' + String(text).replace(/"/g, '""') + '"';
        }

        downloadBtn.addEventListener('click', async () => {
            // UI 로딩 상태 변경
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = "데이터 불러오는 중...";
            loadingSpinner.classList.remove('hidden');
            statusMsg.textContent = "";

            try {
                // Firestore에서 데이터 가져오기
                const querySnapshot = await getDocs(collection(db, "koppen_submissions"));
                
                if (querySnapshot.empty) {
                    statusMsg.textContent = "제출된 데이터가 없습니다.";
                    statusMsg.classList.add('text-red-500');
                    return;
                }

                // CSV 헤더 생성
                let csvContent = "\uFEFF"; // 엑셀에서 한글 깨짐을 방지하는 BOM(Byte Order Mark) 추가
                csvContent += "제출일시,학년,반,번호,이름,1번(객관식),2번(객관식),3번(객관식),4번(주관식),5번(주관식)\n";

                // 데이터 정렬 (제출 시간순 정렬을 위해 배열에 담기)
                const submissions = [];
                querySnapshot.forEach((doc) => {
                    submissions.push(doc.data());
                });

                submissions.sort((a, b) => {
                    const timeA = a.submittedAt ? a.submittedAt.toMillis() : 0;
                    const timeB = b.submittedAt ? b.submittedAt.toMillis() : 0;
                    return timeA - timeB; // 오름차순 정렬
                });

                // 데이터를 CSV 형식으로 변환
                submissions.forEach((data) => {
                    // 날짜 형식 변환
                    let dateStr = "시간정보 없음";
                    if (data.submittedAt) {
                        const dateObj = data.submittedAt.toDate();
                        dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    }

                    const row = [
                        escapeCsv(dateStr),
                        escapeCsv(data.grade),
                        escapeCsv(data.classNum),
                        escapeCsv(data.studentNum),
                        escapeCsv(data.studentName),
                        escapeCsv(data.answers?.q1 || ''),
                        escapeCsv(data.answers?.q2 || ''),
                        escapeCsv(data.answers?.q3 || ''),
                        escapeCsv(data.answers?.q4 || ''),
                        escapeCsv(data.answers?.q5 || '')
                    ];
                    csvContent += row.join(",") + "\n";
                });

                // 브라우저에서 다운로드 처리
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                
                // 파일명 (오늘 날짜 포함)
                const today = new Date();
                const filenameDate = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
                link.setAttribute("download", `학습지_제출결과_${filenameDate}.csv`);
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                statusMsg.textContent = `${submissions.length}명의 데이터 다운로드 완료!`;
                statusMsg.classList.remove('text-red-500');
                statusMsg.classList.add('text-green-600');

            } catch (error) {
                console.error("데이터 다운로드 오류:", error);
                statusMsg.textContent = "오류 발생: " + error.message;
                statusMsg.classList.add('text-red-500');
            } finally {
                // UI 복구
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = "CSV 데이터 다운로드";
                loadingSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
